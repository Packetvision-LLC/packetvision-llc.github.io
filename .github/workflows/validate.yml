name: Validate Packetvision.net

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate build and content
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run pre-deploy validation
        run: ./scripts/pre-deploy.sh

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: packetvision-site-dist
          path: dist
          if-no-files-found: error
